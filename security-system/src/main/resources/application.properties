# 应用名称
spring.application.name=security-system

# 数据库配置
# 数据库连接地址 需提前创建 security_db 数据库 时区配置为 Asia/Shanghai
spring.datasource.url=jdbc:mysql://localhost:3306/security_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
# 数据库密码从环境变量读取 默认值为 root123
spring.datasource.password=${DB_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 配置
# 自动更新表结构 生产环境建议设置为 none 以禁用自动更新
spring.jpa.hibernate.ddl-auto=update
# 控制台输出 SQL 执行语句
spring.jpa.show-sql=true
# 格式化 SQL 输出 提升日志可读性
spring.jpa.properties.hibernate.format_sql=true

# 服务器配置
server.port=8081

# 短信服务配置
# 启用模拟模式 关闭后使用真实短信服务
sms.mock.enabled=true
# 模拟模式下的默认接收手机号
sms.mock.phone=13800138000

# AI 传感器智能分析配置
# 动态异常检测灵敏度系数 数值越大检测越宽松 推荐值 3.5
ai.sensor.stddev.multiplier=3.5
# 启动分析所需的最少历史数据点数量 数值越低越早开始分析
ai.sensor.min-data-points=5

# 系统清理任务配置
# 启用后系统启动时自动清理摄像头相关历史告警
app.clean-camera-alerts=true
